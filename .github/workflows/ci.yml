name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: pmtiles
            features: pmtiles
          - name: pmtiles-cloud
            features: pmtiles,cloud,zstd
          - name: mbtiles
            features: mbtiles
          - name: archives
            features: pmtiles,mbtiles
          - name: postgres
            features: postgres
          - name: duckdb
            features: duckdb
          - name: parquet-archive
            features: parquet-archive
          - name: agtiff
            features: agtiff
          - name: stac
            features: stac
          - name: raster
            features: raster
          - name: postgres-outdb
            features: postgres,raster
          - name: metrics-mlt
            features: metrics,mlt
    services:
      postgres:
        image: ${{ startsWith(matrix.name, 'postgres') && 'postgis/postgis:17-3.5' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: maptile_core_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d maptile_core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FEATURES: ${{ matrix.features }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTDOCFLAGS: "-D warnings"
      CARGO_BUILD_JOBS: "2"
      DATABASE_URL: ${{ startsWith(matrix.name, 'postgres') && 'postgresql://postgres@127.0.0.1:5432/maptile_core_test' || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - name: Ensure native compilation tools are available
        run: |
          if command -v cc && command -v c++ && command -v make \
            && command -v cmake && command -v ninja && command -v pkg-config; then
            exit 0
          fi
          # Use signed Ubuntu repositories independent of the runner's Azure mirror.
          apt_dir=$(mktemp -d)
          trap 'rm -rf "$apt_dir"' EXIT
          chmod 755 "$apt_dir"
          mkdir "$apt_dir/lists"
          cat >"$apt_dir/ubuntu.list" <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu/ noble-security main universe
          EOF
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_dir/ubuntu.list"
            -o Dir::Etc::sourceparts=-
            -o "Dir::State::lists=$apt_dir/lists"
            -o Acquire::Retries=2
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Install PROJ build requirements and GDAL when enabled
        if: contains(matrix.features, 'agtiff') || contains(matrix.features, 'stac') || contains(matrix.features, 'raster')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sqlite3 libsqlite3-dev libproj-dev
          if [[ "$FEATURES" == *raster* ]]; then
            sudo apt-get install --yes --no-install-recommends libgdal-dev
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting and native source helper
        run: |
          cargo fmt --all --check
          bash scripts/ci/maptile-render-cargo_test.sh
      - name: Prepare signed DuckDB extensions
        if: matrix.name == 'duckdb'
        run: cargo run --locked --features duckdb --example geoparquet_extensions -- --install
      - name: Assert feature boundaries
        run: bash scripts/ci/check-feature-dependencies.sh "$FEATURES"
      - name: Test
        run: cargo test --locked --features "$FEATURES"
      - name: Clippy
        run: cargo clippy --locked --all-targets --features "$FEATURES" -- -D warnings
      - name: Rustdoc
        run: cargo doc --locked --no-deps --features "$FEATURES"
      - name: Verify source package
        if: matrix.name == 'default'
        run: cargo package --locked

  macos:
    name: macOS ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: pmtiles
            features: pmtiles,cloud,zstd
          - name: mbtiles
            features: mbtiles
          - name: archives
            features: pmtiles,mbtiles
          - name: parquet-archive
            features: parquet-archive
          - name: agtiff
            features: agtiff
          - name: stac
            features: stac
          - name: raster
            features: raster
          - name: metrics-mlt
            features: metrics,mlt
    env:
      FEATURES: ${{ matrix.features }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2
        with:
          toolchain: "1.98.1"
          components: clippy
      - name: Install PROJ
        if: matrix.name == 'agtiff' || matrix.name == 'stac'
        run: brew install proj
      - name: Install GDAL supported by the Rust bindings
        if: matrix.name == 'raster'
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: raster
          create-args: -c conda-forge libgdal-core-devel=3.12.*
          init-shell: none
      - name: Select the native raster environment
        if: matrix.name == 'raster'
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig"
          [[ "$(pkg-config --modversion gdal)" == 3.12.* ]]
          [[ "$(pkg-config --variable=prefix gdal)" == "$CONDA_PREFIX" ]]
          test -r "$(pkg-config --variable=includedir gdal)/gdal.h"
          test -r "$(pkg-config --variable=libdir gdal)/libgdal.dylib"
          rpath="-C link-arg=-Wl,-rpath,$CONDA_PREFIX/lib"
          {
            echo "GDAL_HOME=$CONDA_PREFIX"
            echo "GDAL_DATA=$CONDA_PREFIX/share/gdal"
            echo "PROJ_DATA=$CONDA_PREFIX/share/proj"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "RUSTFLAGS=$rpath"
            echo "RUSTDOCFLAGS=$rpath"
          } >> "$GITHUB_ENV"
      - name: Assert feature boundaries
        run: bash scripts/ci/check-feature-dependencies.sh "$FEATURES"
      - name: Test
        run: cargo test --locked --features "$FEATURES"
      - name: Clippy
        run: cargo clippy --locked --all-targets --features "$FEATURES" -- -D warnings

  windows-archives:
    name: Windows archive generations
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2
        with:
          toolchain: "1.98.1"
      - name: Exercise file identity, positional I/O and SQLite snapshots
        run: cargo test --locked --features pmtiles,mbtiles --test pmtiles_local --test mbtiles --test control --test service

  native-opengl:
    name: Linux OpenGL renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2
        with:
          toolchain: "1.98.1"
      - name: Install EGL and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev libglfw3-dev libuv1-dev libicu-dev libpng-dev libjpeg-dev libwebp-dev libcurl4-openssl-dev
      - name: Run library tests and render native fixture images
        run: bash scripts/ci/maptile-render-cargo.sh test --locked --features render-opengl --lib --test render_native -- --test-threads=1
