# Vendored from maplibre_native 0.9.3; see README.md for provenance and local changes.

[package]
edition = "2021"
rust-version = "1.90"
name = "maplibre_native"
version = "0.9.3"
publish = false
authors = [
    "Yuri Astrakhan <YuriAstrakhan@gmail.com>",
    "MapLibre contributors",
]
build = "build.rs"
exclude = []
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust bindings to the MapLibre Native map rendering engine"
readme = "README.md"
keywords = [
    "maplibre",
    "rendering",
    "gis",
    "tiles",
]
categories = [
    "external-ffi-bindings",
    "science::geo",
    "rendering",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/maplibre/maplibre-native-rs"

[features]
default = [
    "log",
    "json",
    "geojson",
]
geojson = ["dep:geojson"]
glx = ["opengl"]
json = ["dep:serde_json"]
log = ["dep:log"]
metal = []
opengl = []
tokio = [
    "dep:tokio",
    "tokio/rt",
]
vulkan = []
wgpu = [
    "dep:webgpu-shim",
    "dep:wgpu",
]

[lib]
name = "maplibre_native"
path = "src/lib.rs"

[dependencies.cxx]
version = "1.0"

[dependencies.geojson]
version = "1.0.0"
optional = true

[dependencies.image]
version = "0.25"

[dependencies.log]
version = "0.4"
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.thiserror]
version = "2.0.16"

[dependencies.tokio]
version = "1"
features = []
optional = true
default-features = false

[dependencies.url]
version = "2.5.7"

[dependencies.webgpu-shim]
version = "0.1"
optional = true

[dependencies.wgpu]
version = "29.0.0"
optional = true

[build-dependencies.cmake]
version = "0.1"

[build-dependencies.cxx-build]
version = "1.0"

[build-dependencies.flate2]
version = "1.1"

[build-dependencies.tar]
version = "0.4.44"

[build-dependencies.walkdir]
version = "2.5.0"

[build-dependencies.webgpu-shim]
version = "0.1"
optional = true

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_qualifications = "warn"
